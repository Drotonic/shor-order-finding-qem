[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shor-order-finding-qem"
version = "0.1.2"
description = "Arithmetic-register reset and distribution-level ZNE for quantum order finding"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8"]
gpu-cuda12 = ["qiskit==2.4.1", "cupy-cuda12x>=14,<15", "tqdm>=4.66"]
gpu-cuda13 = ["qiskit==2.4.1", "cupy-cuda13x>=14,<15", "tqdm>=4.66"]

[project.urls]
Repository = "https://github.com/Drotonic/shor-order-finding-qem"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
