[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shor-error-mitigation"
version = "0.1.0"
description = "Reproducible analysis and GPU simulator for the N=119 order-finding study"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
gpu = [
  "qiskit>=2.0",
  "cupy-cuda12x>=13",
  "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]

